schema_version: 1.0.0
form: {id: ll, version: 4.2.0}
references:
  code_lists:
    - refs_admin.countries
    - refs_admin.entities
    - refs_admin.ports
    - refs_biology.bait_conditions
    - refs_biology.bait_types
    - refs_biology.biological_materials
    - refs_biology.depredation_sources
    - refs_biology.fates
    - refs_biology.handling_methods
    - refs_biology.individual_conditions
    - refs_biology.maturity_stages
    - refs_biology.measurement_tools
    - refs_biology.measurements
    - refs_biology.sample_preservation_methods
    - refs_biology.sampling_methods_for_catch_estimation
    - refs_biology.sampling_methods_for_sampling_collections
    - refs_biology.sampling_periods
    - refs_biology.sampling_protocols
    - refs_biology.sex
    - refs_biology.species
    - refs_biology.bait_species
    - refs_biology.predator_species
    - refs_biology.tag_types
    - refs_biology.fate_types
    - refs_biology.weight_measurement_tools
    - refs_biology.weight_measurements
    - refs_data.data_sources_ro
    - refs_data.logical_responses
    - refs_fishery.branchline_storages
    - refs_fishery.dehooker_types
    - refs_fishery.fish_preservation_methods
    - refs_fishery.fish_processing_types
    - refs_fishery.fish_storage_types
    - refs_fishery.hook_and_terminal_devices
    - refs_fishery.hull_material_types
    - refs_fishery.light_colours
    - refs_fishery.light_types
    - refs_fishery.line_material_types
    - refs_fishery.mitigation_devices
    - refs_fishery.offal_management_types
    - refs_fishery.reasons_days_lost
    - refs_fishery.streamer_types
    - refs_fishery.vessel_sections
    - refs_fishery.waste_categories
    - refs_fishery.waste_disposal_methods
    - refs_fishery_config.gears
    - refs_fishery_config.target_species
  registries:
    - ros_meta.contact
    - ros_meta.focal_point
    - ros_meta.observer
    - ros_meta.vessel
sheets:
  META:
    layout: {kind: cells, column_count: 7}
    fields:
      form_identifier: {mandatory: true, location: D4, type: string, enum: [ROS-LL]}
      form_revision: {mandatory: true, location: G4, type: string, enum: ["4.2.0"]}
      liaison_officer_full_name: {mandatory: true, location: D9, type: string, reference: {catalogue: registries, table: ros_meta.focal_point, lookup: full_name}}
      liaison_officer_email: {mandatory: true, location: D10, type: email, reference: {catalogue: registries, table: ros_meta.focal_point, lookup: email}}
      organisation_name: {mandatory: true, location: G9, type: string}
      organisation_email: {location: G10, type: email}
      finalisation_date: {mandatory: true, location: D12, type: date}
      submission_date: {mandatory: true, location: D13, type: date}
      reporting_year: {mandatory: true, location: D18, type: integer, minimum: 1000, maximum: 9999}
      reporting_entity: {mandatory: true, location: D19, type: string, reference: {catalogue: code_lists, table: refs_admin.entities, lookup: code}}
      reporting_country_code: {mandatory: true, location: D20, type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      data_source: {mandatory: true, location: D21, type: string, reference: {catalogue: code_lists, table: refs_data.data_sources_ro, lookup: code}}
      # comments: {location: C26, type: string}
  O-INFO:
    layout: {kind: table, start_row: 5}
    primary_key: [observed_trip_id]
    fields:
      observed_trip_id: {mandatory: true, type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])/[^/[:space:]]+/[^/[:space:]]+/LL$'}
      observer_identification_iotc_id: {mandatory: true, type: string, reference: {catalogue: registries, table: ros_meta.observer, lookup: iotc_observer_identifier}}
      observer_identification_full_name: {type: string, reference: {catalogue: registries, table: ros_meta.observer, lookup: full_name, severity: warning}}
      observer_trip_details_embarkation_in_port_country: {type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      observer_trip_details_embarkation_in_port_port: {type: string, reference: {catalogue: code_lists, table: refs_admin.ports, lookup: code}}
      observer_trip_details_embarkation_at_sea_latitude: {type: latitude}
      observer_trip_details_embarkation_at_sea_longitude: {type: longitude}
      observer_trip_details_embarkation_date_time: {type: datetime}
      observer_trip_details_disembarkation_in_port_country: {type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      observer_trip_details_disembarkation_in_port_port: {type: string, reference: {catalogue: code_lists, table: refs_admin.ports, lookup: code}}
      observer_trip_details_disembarkation_at_sea_latitude: {type: latitude}
      observer_trip_details_disembarkation_at_sea_longitude: {type: longitude}
      observer_trip_details_disembarkation_date_time: {type: datetime}
      observed_trip_summary_number_fishing_sets_conducted: {mandatory: true, type: integer}
      observed_trip_summary_number_fishing_sets_observed: {mandatory: true, type: integer}
      observed_trip_summary_number_of_days_searching: {type: number}
      observed_trip_summary_number_of_days_actively_fishing: {type: number}
      observed_trip_summary_number_of_days_in_fishing_area: {type: number}
      observed_trip_summary_number_of_days_transiting: {type: number}
      observed_trip_summary_number_of_days_lost: {type: number}
      observed_trip_summary_reasons_for_days_lost_reason_1: {type: string, reference: {catalogue: code_lists, table: refs_fishery.reasons_days_lost, lookup: code}}
      observed_trip_summary_reasons_for_days_lost_reason_2: {type: string, reference: {catalogue: code_lists, table: refs_fishery.reasons_days_lost, lookup: code}}
      observed_trip_summary_reasons_for_days_lost_reason_3: {type: string, reference: {catalogue: code_lists, table: refs_fishery.reasons_days_lost, lookup: code}}
      observed_trip_summary_reasons_for_days_lost_reason_4: {type: string, reference: {catalogue: code_lists, table: refs_fishery.reasons_days_lost, lookup: code}}
  V-INFO:
    layout: {kind: table, start_row: 4}
    primary_key: [observed_trip_id]
    parent_key: {sheet: O-INFO, fields: [observed_trip_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      identification_name: {mandatory: true, type: string, reference: {catalogue: registries, table: ros_meta.vessel, lookup: vessel_name, severity: warning}}
      identification_flag_or_chartering_state: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      identification_iotc_number: {mandatory: true, type: string, reference: {catalogue: registries, table: ros_meta.vessel, lookup: iotc_vessel_identifier}}
      identification_imo_number: {type: string, reference: {catalogue: registries, table: ros_meta.vessel, lookup: imo_identifier, severity: warning}}
      identification_ircs: {type: string, reference: {catalogue: registries, table: ros_meta.vessel, lookup: ircs_identifier, severity: warning}}
      registration_country: {type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      registration_port: {type: string, reference: {catalogue: code_lists, table: refs_admin.ports, lookup: code}}
      registration_registration_number: {type: string, reference: {catalogue: registries, table: ros_meta.vessel, lookup: registration_identifier}}
      licensed_target_species: {type: string, reference: {catalogue: code_lists, table: refs_fishery_config.target_species, lookup: code}}
      gear_main_fishing_gear: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_fishery_config.gears, lookup: code}}
      personnel_fishing_master_full_name: {mandatory: true, type: string, reference: {catalogue: registries, table: ros_meta.contact, lookup: full_name}}
      personnel_fishing_master_nationality: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      personnel_skipper_captain_full_name: {mandatory: true, type: string, reference: {catalogue: registries, table: ros_meta.contact, lookup: full_name}}
      personnel_skipper_captain_nationality: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      personnel_crew_number: {type: integer}
  V-TRIP:
    layout: {kind: table, start_row: 4}
    primary_key: [observed_trip_id]
    parent_key: {sheet: O-INFO, fields: [observed_trip_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      vessel_departure_port_country: {type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      vessel_departure_port_port: {type: string, reference: {catalogue: code_lists, table: refs_admin.ports, lookup: code}}
      vessel_departure_port_latitude: {type: latitude}
      vessel_departure_port_longitude: {type: longitude}
      vessel_departure_date_time: {type: datetime}
      vessel_return_port_country: {type: string, reference: {catalogue: code_lists, table: refs_admin.countries, lookup: code}}
      vessel_return_port_port: {type: string, reference: {catalogue: code_lists, table: refs_admin.ports, lookup: code}}
      vessel_return_port_latitude: {type: latitude}
      vessel_return_port_longitude: {type: longitude}
      vessel_return_date_time: {type: datetime}
  V-ATTRIBUTES:
    layout: {kind: table, start_row: 4}
    primary_key: [observed_trip_id]
    parent_key: {sheet: O-INFO, fields: [observed_trip_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      vessel_attributes_gross_tonnage: {type: integer}
      vessel_attributes_loa_m: {type: number}
      vessel_attributes_hull_material: {type: string, reference: {catalogue: code_lists, table: refs_fishery.hull_material_types, lookup: code}}
      vessel_attributes_main_engine_1_make: {type: string}
      vessel_attributes_main_engine_1_power_value: {type: integer}
      vessel_attributes_main_engine_1_power_unit: {type: string, required_field: vessel_attributes_main_engine_1_power_value, enum: [kW, hp, bhp]}
      vessel_attributes_main_engine_2_make: {type: string}
      vessel_attributes_main_engine_2_power_value: {type: integer}
      vessel_attributes_main_engine_2_power_unit: {type: string, required_field: vessel_attributes_main_engine_2_power_value, enum: [kW, hp, bhp]}
      vessel_attributes_fish_storage_capacity_m3: {type: number}
      vessel_attributes_fish_preservation_methods_method_1: {type: string, reference: {catalogue: code_lists, table: refs_fishery.fish_preservation_methods, lookup: code}}
      vessel_attributes_fish_preservation_methods_method_2: {type: string, reference: {catalogue: code_lists, table: refs_fishery.fish_preservation_methods, lookup: code}}
      vessel_attributes_fish_preservation_methods_method_3: {type: string, reference: {catalogue: code_lists, table: refs_fishery.fish_preservation_methods, lookup: code}}
      vessel_attributes_fish_preservation_methods_method_4: {type: string, reference: {catalogue: code_lists, table: refs_fishery.fish_preservation_methods, lookup: code}}
      vessel_attributes_fish_storage_types_type_1: {type: string, reference: {catalogue: code_lists, table: refs_fishery.fish_storage_types, lookup: code}}
      vessel_attributes_fish_storage_types_type_2: {type: string, reference: {catalogue: code_lists, table: refs_fishery.fish_storage_types, lookup: code}}
      vessel_attributes_fish_storage_types_type_3: {type: string, reference: {catalogue: code_lists, table: refs_fishery.fish_storage_types, lookup: code}}
      vessel_attributes_autonomy_range_value: {type: number}
      vessel_attributes_autonomy_range_unit: {type: string, required_field: vessel_attributes_autonomy_range_value, enum: [days, nm]}
      vessel_electronics_gnss: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_vms: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_ais: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_radars: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_track_plotter: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_depth_sounder: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_sonar: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_doppler_current_meter: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_xbt: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_vhf_radios: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_hf_radios: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_satcom: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      vessel_electronics_fis: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      waste_management_details_1_category_1: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_categories, lookup: code}}
      waste_management_details_1_storage_disposal_method_1: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_disposal_methods, lookup: code}}
      waste_management_details_2_category_2: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_categories, lookup: code}}
      waste_management_details_2_storage_disposal_method_2: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_disposal_methods, lookup: code}}
      waste_management_details_3_category_3: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_categories, lookup: code}}
      waste_management_details_3_storage_disposal_method_3: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_disposal_methods, lookup: code}}
      waste_management_details_4_category_4: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_categories, lookup: code}}
      waste_management_details_4_storage_disposal_method_4: {type: string, reference: {catalogue: code_lists, table: refs_fishery.waste_disposal_methods, lookup: code}}
  G-GENERAL:
    layout: {kind: table, start_row: 3}
    primary_key: [observed_trip_id]
    parent_key: {sheet: O-INFO, fields: [observed_trip_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      special_equipment_or_machinery_line_setter_shooter: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      special_equipment_or_machinery_line_hauler: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      special_equipment_or_machinery_bait_casting_machine: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
  G-CONFIG-BRANCHLINES:
    layout: {kind: table, start_row: 3}
    unique_key: [observed_trip_id, branchline_configurations_configuration_id]
    parent_key: {sheet: O-INFO, fields: [observed_trip_id]}
    at_least_one: {fields: [branchline_configurations_configuration_id, branchline_configurations_section_id, branchline_configurations_material_type, branchline_configurations_length_m, branchline_configurations_diameter_cm, additional_branchline_details_storage_1, additional_branchline_details_storage_2, additional_branchline_details_storage_3, additional_branchline_details_storage_4], severity: warning}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      branchline_configurations_configuration_id: {type: string}
      branchline_configurations_section_id: {type: string}
      branchline_configurations_material_type: {type: string, reference: {catalogue: code_lists, table: refs_fishery.line_material_types, lookup: code}}
      branchline_configurations_length_m: {type: number}
      branchline_configurations_diameter_cm: {type: number}
      additional_branchline_details_storage_1: {type: string, reference: {catalogue: code_lists, table: refs_fishery.branchline_storages, lookup: code}}
      additional_branchline_details_storage_2: {type: string, reference: {catalogue: code_lists, table: refs_fishery.branchline_storages, lookup: code}}
      additional_branchline_details_storage_3: {type: string, reference: {catalogue: code_lists, table: refs_fishery.branchline_storages, lookup: code}}
      additional_branchline_details_storage_4: {type: string, reference: {catalogue: code_lists, table: refs_fishery.branchline_storages, lookup: code}}
  G-CONFIG-MITIGATION-DEVICES:
    layout: {kind: table, start_row: 4}
    primary_key: [observed_trip_id]
    parent_key: {sheet: O-INFO, fields: [observed_trip_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      tori_line_details_tori_line_length_m: {mandatory: true, type: number}
      tori_line_details_streamer_type: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_fishery.streamer_types, lookup: code}}
      tori_line_details_streamer_reach_surface: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      tori_line_details_streamer_line_length_max_m: {mandatory: true, type: number}
      tori_line_details_streamer_line_length_min_m: {type: number}
      tori_line_details_streamer_number_per_line: {mandatory: true, type: integer}
      tori_line_details_distance_between_streamers_m: {type: number}
      tori_line_details_tori_line_attached_height_m: {mandatory: true, type: number}
      tori_line_details_towed_objects_type: {type: string}
      tori_line_details_towed_objects_number: {type: integer}
      tori_line_details_tori_line_sketch_in_trip_report: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      other_mitigation_devices_device_1: {type: string, reference: {catalogue: code_lists, table: refs_fishery.mitigation_devices, lookup: code}}
      other_mitigation_devices_device_2: {type: string, reference: {catalogue: code_lists, table: refs_fishery.mitigation_devices, lookup: code}}
      other_mitigation_devices_device_3: {type: string, reference: {catalogue: code_lists, table: refs_fishery.mitigation_devices, lookup: code}}
      other_mitigation_devices_device_4: {type: string, reference: {catalogue: code_lists, table: refs_fishery.mitigation_devices, lookup: code}}
      other_mitigation_devices_device_5: {type: string, reference: {catalogue: code_lists, table: refs_fishery.mitigation_devices, lookup: code}}
  E-SET:
    layout: {kind: table, start_row: 4}
    primary_key: [observed_trip_id, set_id]
    parent_key: {sheet: O-INFO, fields: [observed_trip_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      set_id: {mandatory: true, type: string}
      start_setting_date_time: {mandatory: true, type: datetime}
      start_setting_position_latitude: {mandatory: true, type: latitude}
      start_setting_position_longitude: {mandatory: true, type: longitude}
      end_setting_date_time: {mandatory: true, type: datetime}
      end_setting_position_latitude: {mandatory: true, type: latitude}
      end_setting_position_longitude: {mandatory: true, type: longitude}
      vessel_speed_kn: {mandatory: true, type: number}
      line_setter_speed_ms: {mandatory: true, type: number}
      mainline_material: {type: string, reference: {catalogue: code_lists, table: refs_fishery.line_material_types, lookup: code}}
      mainline_length_value: {type: number}
      mainline_length_unit: {type: string, required_field: mainline_length_value, enum: [km, nm]}
      clip_on_time_branchline: {type: number}
      clip_on_time_buoys: {type: number}
      number_total_hooks_set: {mandatory: true, type: integer}
      number_total_floats_set: {type: integer}
      number_radio_dhan_buoys_set: {type: integer}
      floatline_length_1_m: {mandatory: true, type: number}
      floatline_length_2_m: {type: number}
      floatline_length_3_m: {type: number}
      number_hooks_between_floats: {mandatory: true, type: integer}
      distance_between_branchlines_m: {type: number}
      shark_lines_set: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      shark_lines_number: {type: integer}
      leader_material_type: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_fishery.line_material_types, lookup: code}}
      leader_material_percentage: {mandatory: true, type: number}
      branchline_length_minimum_value: {mandatory: true, type: number, maximum_field: branchline_length_maximum_value}
      branchline_length_maximum_value: {mandatory: true, type: number}
      target_species_species_1: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_biology.species, lookup: code}}
      target_species_species_2: {type: string, reference: {catalogue: code_lists, table: refs_biology.species, lookup: code}}
      target_species_species_3: {type: string, reference: {catalogue: code_lists, table: refs_biology.species, lookup: code}}
      target_species_species_4: {type: string, reference: {catalogue: code_lists, table: refs_biology.species, lookup: code}}
  E-SET-LIGHTS:
    layout: {kind: table, start_row: 2}
    primary_key: [observed_trip_id, set_id, type, colour]
    parent_key: {sheet: E-SET, fields: [observed_trip_id, set_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      set_id: {mandatory: true, type: string}
      type: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_fishery.light_types, lookup: code}}
      colour: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_fishery.light_colours, lookup: code}}
      number_of_lights: {mandatory: true, type: integer}
  E-SET-MITIGATION-MEASURES:
    layout: {kind: table, start_row: 3}
    primary_key: [observed_trip_id, set_id]
    parent_key: {sheet: E-SET, fields: [observed_trip_id, set_id]}
    fields:
      observed_trip_id: {mandatory: true, type: string}
      set_id: {mandatory: true, type: string}
      number_tori_lines_deployed: {mandatory: true, type: integer}
      minimum_deck_lighting_used: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      branchline_weighted: {type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      average_sinker_weight_g: {mandatory: true, type: number}
      percent_branchline_weighted: {mandatory: true, type: number}
      hook_sinker_distance_cm: {mandatory: true, type: number}
      hook_pods: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_data.logical_responses, lookup: code}}
      branchline_details_configuration_number: {type: string}
      branchline_details_num_branchlines_set: {type: integer}
      other_mitigation_measures_used_measure_1: {mandatory: true, type: string, reference: {catalogue: code_lists, table: refs_fishery.mitigation_devices, lookup: code}}
